# STEP 2 (after `certbot certonly --webroot -w /var/www/letsencrypt -d lottery.myappstore.org.in`):
#   sudo cp deploy/nginx/lottery.myappstore.org.in.conf /etc/nginx/sites-available/lottery.myappstore.org.in
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name lottery.myappstore.org.in;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {    # keeps certbot renewals working
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 301 https://lottery.myappstore.org.in$request_uri;
    }
}

server {
    listen 443 ssl http2;                          # nginx 1.24 syntax (not `http2 on;`)
    listen [::]:443 ssl http2;
    server_name lottery.myappstore.org.in;

    ssl_certificate     /etc/letsencrypt/live/lottery.myappstore.org.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lottery.myappstore.org.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:lottery_ssl:10m;
    ssl_session_timeout 1d;

    # Only this host - no includeSubDomains (other *.myappstore.org.in sites are separate).
    add_header Strict-Transport-Security "max-age=31536000" always;

    include snippets/lottery.myappstore.org.in.inc;
}
